version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: reviewlens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: reviewlens

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviewlens-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/reviewlens
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: llama3-8b-8192
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reviewlens-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
